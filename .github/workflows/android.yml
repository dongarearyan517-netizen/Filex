
name: Build TANO FileX APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TanoFilex_Purple_New_Layout.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle
        run: |
          curl -fsSLo gradle.zip \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q TanoFilex_Purple_New_Layout.zip -d extracted

      - name: Build APK
        run: |
          gradle --no-daemon --stacktrace \
            -p extracted/TanoFilex assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TANO-FileX-New-Layout
          path: extracted/TanoFilex/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
