
name: Build TANO FileX APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TANO_FileX_GitHub_Upload.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract TANO FileX
        run: |
          unzip -q TANO_FileX_GitHub_Upload.zip -d project
          test -f project/TanoFilex/settings.gradle
          test -f project/TanoFilex/app/build.gradle

      - name: Build APK
        working-directory: project/TanoFilex
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TANO-FileX-APK
          path: project/TanoFilex/app/build/outputs/apk/debug/*.apk
          
