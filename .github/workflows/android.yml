
name: Build TANO FileX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Android project and build APK
        run: |
          echo "Searching for Android project..."

          SETTINGS_FILE=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Cannot find settings.gradle"
            echo "Repository structure:"
            find . -maxdepth 4 -type f | head -150
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Project found: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "ERROR: Android app module not found."
            find . -maxdepth 3 -type f
            exit 1
          fi

          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TANO-FileX-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
