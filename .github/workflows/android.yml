
name: Build TANO FileX APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TanoFilex_audited.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Extract project
        run: |
          unzip -q TanoFilex_audited.zip -d extracted
          find extracted -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          cd extracted/TanoFilex
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TANO-FileX-APK
          path: extracted/TanoFilex/app/build/outputs/apk/debug/app-debug.apk
          
