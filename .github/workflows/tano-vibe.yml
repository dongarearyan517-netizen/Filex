
name: TANO VIBE Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Find TANO VIBE ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 4 -type f -iname "Tanovibe.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Tanovibe.zip not found!"
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate Android project
        run: |
          GRADLE_FILE=$(find extracted -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: gradlew not found. Checking build files..."
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload TANO VIBE APK
        uses: actions/upload-artifact@v4
        with:
          name: TANO-VIBE-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
