
name: TANO VIBE Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Extract TANO VIBE
        run: |
          mkdir -p extracted
          unzip -o Tanovibe.zip -d extracted

          test -f extracted/TanoVibe/settings.gradle
          test -f extracted/TanoVibe/app/build.gradle

      - name: Build APK
        working-directory: extracted/TanoVibe
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload TANO VIBE APK
        uses: actions/upload-artifact@v4
        with:
          name: TANO-VIBE-APK
          path: extracted/TanoVibe/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
